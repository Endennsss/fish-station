- type: entity
  parent: BaseItem
  id: FishResearchScanner
  name: experimental scanner
  description: A portable instrument for collecting experimental measurements for a paired research server.
  suffix: Fish
  components:
  - type: Sprite
    sprite: _Fish/Objects/Devices/research_scanner.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _Fish/Objects/Devices/research_scanner.rsi
  - type: FishResearchScanner
  - type: ResearchClient
    fishAutoConnect: false
  - type: ActivatableUI
    key: enum.ResearchClientUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
